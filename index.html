<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калкулатор ресто ЕВРО-ЛЕВ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .form-row {
            margin-bottom: 10px; /* Space between rows */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .form-row label {
            display: block;
            margin-bottom: 5px;
        }
        .left-part {
            flex: 0 0 40%; /* Reduce width of left part */
            margin-right: 10px; /* Space between left and right parts */
        }
        .right-part {
            flex: 1; /* Right part takes remaining space */
        }
        .form-row input {
            width: calc(100% - 5px); /* Full width minus some space */
            max-width: 11ch; /* Limit input width to 7 characters */
            padding: 8px;
        }
        select {
            width: 80px; /* Set a fixed width for the drop-down to clearly show all letters */
            padding: 8px; /* Consistent padding */
        }
        .button-container {
            display: flex;
            justify-content: space-between;
        }
        button {
            padding: 10px 15px;
        }
    </style>
</head>
<body>

    <form id="simpleForm">
        <div class="form-row">
            <div class="left-part">
                <label for="priceEURO">Цена (ЕВРО)</label>
                <input type="text" id="priceEURO" maxlength="7" required oninput="convertPrice(event)">
            </div>
            <div class="right-part">
                <label for="priceBGN">x 1.95583 (ЛЕВ)</label>
                <input type="text" id="priceBGN" maxlength="7" oninput="convertPrice(event)">
            </div>
        </div>
        
        <div class="form-row">
            <div class="left-part">
                <label for="amount">Сума</label>
                <input type="text" id="amount" maxlength="7" required>
            </div>
            <div class="right-part">
                <label for="currency">Валута</label>
                <select id="currency">
                    <option value="BGN">ЛЕВ</option>
                    <option value="EURO">ЕВРО</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="left-part"><span id="changeEURO">0</span> ЕВРО</div>
            <div class="right-part"><span id="changeBGN">0</span> ЛЕВ</div>
        </div>

        <div class="form-row">
            <div class="left-part button-container">
                <button type="button" onclick="clearFields()">Изтрий</button>
            </div>
            <div class="right-part button-container">
                <button type="button" onclick="calcChange()">Сметни</button>
            </div>
        </div>
    </form>

    <script>
        const rate = 1.95583;

        function clearFields()
        {
            document.getElementById('priceEURO').value = '';
            document.getElementById('priceBGN').value = '';
            document.getElementById('amount').value = '';
            document.getElementById('changeEURO').innerText = 0;
            document.getElementById('changeBGN').innerText = 0;
        }

        function calcChange()
        {
            const currency = document.getElementById('currency').value;
            const amount = Number.parseFloat(document.getElementById('amount').value);
            const priceEuro = document.getElementById('priceEURO').value;
            const priceBgn = document.getElementById('priceBGN').value;
            var changeEuro = 0;
            var changeBgn = 0;
            
            if (amount > 0)
            {
                try {
                    if (currency === 'EURO') {
                        if (amount < priceEuro) {
                            throw new Error('Сумата в EURO трябва да бъде по-голяма от цената в EURO!');
                        }
                        changeEuro = amount - priceEuro;
                        changeBgn = changeEuro * rate;
                    } else if (currency === 'BGN') {
                        if (amount < priceBgn) {
                            throw new Error('Сумата в ЛЕВ трябва да бъде по-голяма от цената в ЛЕВ!');
                        }
                        changeBgn = amount - priceBgn;
                        changeEuro = changeBgn / rate;
                    }
                    document.getElementById('changeEURO').innerText = changeEuro.toFixed(2);
                    document.getElementById('changeBGN').innerText = changeBgn.toFixed(2);
                } catch (err) {
                    alert(err);
                }
            }
        }

        function convertPrice(event)
        {
            var priceId = event.target.id;
            var price = Number.parseFloat(document.getElementById(priceId).value);
            var priceConvertedId = '';
            var multiplier = 1;
            if (priceId === 'priceEURO') {
                priceConvertedId = 'priceBGN';
                multiplier = rate;
            } else if (priceId === 'priceBGN') {
                priceConvertedId = 'priceEURO';
                multiplier = 1 / rate;
            }

            if (price !== undefined && !Number.isNaN(price) && price > 0) {
                document.getElementById(priceConvertedId).value = (price * multiplier).toFixed(2);
            } else {
                document.getElementById(priceConvertedId).value = '';
            }
        }
    </script>
</body>
</html>
